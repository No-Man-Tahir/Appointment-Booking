services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-postgres
    environment:
      POSTGRES_DB: appointment_app
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U appointment_user -d appointment_app"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: