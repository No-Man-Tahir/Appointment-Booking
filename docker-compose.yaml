services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment_app}
      POSTGRES_USER: ${POSTGRES_USER:-appointment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointment_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-appointment_user} -d ${POSTGRES_DB:-appointment_app}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: appointment-backend

    environment:
      NODE_ENV: development
      PORT: 4000

      DATABASE_URL: postgresql://${POSTGRES_USER:-appointment_user}:${POSTGRES_PASSWORD:-appointment_password}@postgres:5432/${POSTGRES_DB:-appointment_app}

      CLIENT_ORIGIN: http://localhost:3000

      JWT_SECRET: ${JWT_SECRET}

      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped


  seed:
    image: postgres:16-alpine
    container_name: appointment-seed

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-appointment_password}

    volumes:
      - ./backend/src/db/seeds/docker.sql:/seed.sql:ro

    command:
      [
        "sh",
        "-c",
        "psql -h postgres -U ${POSTGRES_USER:-appointment_user} -d ${POSTGRES_DB:-appointment_app} -v ON_ERROR_STOP=1 -f /seed.sql"
      ]

    depends_on:
      backend:
        condition: service_healthy

    restart: "no"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        BACKEND_API_URL: http://localhost:4000
        NEXT_PUBLIC_APPOINTMENT_DURATION: 30

    container_name: appointment-frontend

    environment:
      NODE_ENV: production

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

      seed:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  postgres_data: